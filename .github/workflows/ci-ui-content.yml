name: CI plugin-content_ui

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]*'
    paths:
      - 'frontend/plugins/content_ui/**'
      - 'frontend/libs/**'
      - '.github/workflows/ci-ui-content.yml'
  pull_request:
    paths:
      - 'frontend/plugins/content_ui/**'
      - 'frontend/libs/**'
      - '.github/workflows/ci-ui-content.yml'

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write

jobs:
  content_ui-ci:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Set environment variables
        run: |
          echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Build content UI
        run: |
          export NX_DAEMON=false
          pnpm nx build content_ui

      - name: Sync to Cloudflare R2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            FOLDER="${{ github.ref_name }}"
          else
            FOLDER="latest"
          fi
          # Upload the chunks BEFORE remoteEntry.js, and only prune afterwards.
          #
          # remoteEntry.js names the exact hashed chunks a build needs, and R2
          # serves it `no-store` while chunks are `immutable`. A plain sync into
          # the mutable `latest/` folder therefore leaves whichever chunks the
          # last build happened to write, and a fresh entry can end up pointing
          # at chunks that were never uploaded — the module then 404s at import
          # and Module Federation reports it as "failed to load".
          #
          # Ordering matters in both directions: publishing the entry last means
          # it is never live before its chunks, and deleting last means a browser
          # already running the previous entry keeps its chunks until the new one
          # is fully in place.
          aws s3 sync dist/frontend/plugins/content_ui s3://erxes-next/$FOLDER/content_ui/ \
            --exclude remoteEntry.js \
            --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com

          aws s3 cp dist/frontend/plugins/content_ui/remoteEntry.js s3://erxes-next/$FOLDER/content_ui/remoteEntry.js \
            --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com

          # Prune chunks left behind by earlier builds so `latest/` cannot keep
          # accumulating them. Tag folders are immutable, so only prune `latest`.
          if [[ "$FOLDER" == "latest" ]]; then
            aws s3 sync dist/frontend/plugins/content_ui s3://erxes-next/$FOLDER/content_ui/ \
              --delete \
              --endpoint-url https://7c8392aff8ac4518aa06dfa4b6337ef2.r2.cloudflarestorage.com
          fi
