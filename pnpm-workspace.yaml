packages:
  - 'backend/**'
  - 'frontend/**'
  # Build outputs are NOT workspace packages.
  #
  # `backend/**` matches any directory, and every compiled dist/ carries a
  # generated package.json, so pnpm treated them as real packages and wrote
  # phantom importers ("backend/core-api/dist:", "backend/plugins/*/dist:")
  # into pnpm-lock.yaml on every regeneration — after any local `nx build`.
  #
  # That lockfile is what Docker installs from with --frozen-lockfile, so the
  # noise is not cosmetic: it makes the lockfile depend on whether someone had
  # built locally, and produces large spurious diffs that hide real dependency
  # changes. Excluded here rather than by deleting dist/ before each
  # regeneration, which would have to be remembered every time.
  - '!**/dist/**'
  - '!**/dist'

# NOTE: `overrides` deliberately lives in package.json's `pnpm` field, not
# here, even though pnpm 9.12.3 prints a warning saying that field is ignored.
#
# Moving them here broke every deploy with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
# The two pnpm versions in play disagree about which file is authoritative:
# 9.12.3 (the pinned one) does not read overrides from this file — regenerating
# the lockfile with it strips the block entirely — while 9.15.x does read it.
# The lockfile can only satisfy one of them, and the pinned version is the one
# that has to win.
#
# Revisit when the repo moves to pnpm 10, where package.json's `pnpm` field is
# genuinely gone and this file becomes the only home.
