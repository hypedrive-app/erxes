packages:
  - 'backend/**'
  - 'frontend/**'
  # Build outputs are NOT workspace packages.
  #
  # `backend/**` matches any directory, and every compiled dist/ carries a
  # generated package.json, so pnpm treated them as real packages and wrote
  # phantom importers ("backend/core-api/dist:", "backend/plugins/*/dist:")
  # into pnpm-lock.yaml on every regeneration — after any local `nx build`.
  #
  # That lockfile is what Docker installs from with --frozen-lockfile, so the
  # noise is not cosmetic: it makes the lockfile depend on whether someone had
  # built locally, and produces large spurious diffs that hide real dependency
  # changes. Excluded here rather than by deleting dist/ before each
  # regeneration, which would have to be remembered every time.
  - '!**/dist/**'
  - '!**/dist'

# Moved here from package.json's `pnpm.overrides`, which pnpm 9 no longer
# reads — it says so out loud on every command:
#
#   [WARN] The "pnpm" field in package.json is no longer read by pnpm.
#   The following keys were ignored: "pnpm.overrides".
#
# The current lockfile still carries them, because it was generated when that
# field was still honoured. So nothing is broken today, but the next
# regeneration would have silently dropped all five — and the deploy installs
# with --frozen-lockfile, so the drop would land as a resolution change nobody
# asked for rather than an error.
overrides:
  '@types/ws': ^8.18.1
  ioredis: ^5.6.1
  # Mastra's packages ask for zod 4; the rest of this repo is on zod 3, and
  # the two are not interchangeable at the type level. Pinning their zod to 3
  # is what keeps a single copy resolved across the tree.
  '@mastra/core>zod': ^3.25.0
  '@mastra/memory>zod': ^3.25.0
  '@mastra/libsql>zod': ^3.25.0
