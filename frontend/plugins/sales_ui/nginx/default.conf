# sales_ui — Module Federation remote host.
#
# Derived from frontend/plugins/frontline_ui/nginx/default.conf, which in turn
# came from frontend/core-ui/nginx/default.conf minus everything that only makes
# sense for an SPA. There is deliberately NO `try_files ... /index.html`
# fallback: this origin serves build artifacts, never routes. A missing chunk
# must surface as a 404, not as index.html delivered with a JS content-type,
# which is the classic way a stale-hash chunk turns into an inscrutable
# "Unexpected token '<'" in the console.
#
# server_name is `_` (default server). Dokploy's Traefik routes by Host and
# proxies to this container, so the vhost must answer whatever hostname the
# operator registers. There is no ${NGINX_HOST} placeholder here because, unlike
# core-ui, this image ships no entrypoint doing sed substitution — nothing would
# ever replace it.

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # ── remoteEntry.js: never cache ──────────────────────────────────────────
    # This is the MF manifest. Every other file here is content-hashed and thus
    # immutable, but remoteEntry.js keeps a STABLE name across builds — it is
    # the one file whose contents change under a fixed URL. Cache it and a
    # redeploy leaves browsers holding a manifest that points at chunk hashes
    # that no longer exist.
    location ~ .*remoteEntry.js$ {
        expires -1;
        add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        add_header Access-Control-Allow-Origin *;
    }

    # ── Fonts: CORS required ─────────────────────────────────────────────────
    # Unlike scripts, the CSS Font Loading path IS CORS-gated: a @font-face
    # whose URL is cross-origin is fetched in cors mode and is rejected without
    # this header, silently falling back to a system font.
    location ~* \.(eot|otf|ttf|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # ── Hashed chunks and assets ─────────────────────────────────────────────
    # rspack emits `<id>.<contenthash>.js`, so a given URL's bytes never change
    # and a long immutable TTL is safe.
    #
    # ACAO is NOT needed for the chunk <script> tags themselves — see the CORS
    # note in deploy/docker-compose.yml — but it IS needed for anything fetched
    # in cors mode from this origin, and `add_header` does not inherit into more
    # specific blocks, so it is repeated here rather than hoisted to `server`.
    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
