<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <!-- Overwritten at container start from REACT_APP_APP_TITLE, so one image
         can serve several deployments. This default is the fallback shown for
         the split second before that substitution lands, and whenever the var
         is unset. -->
    <title>Hypedrive CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Roboto+Mono:wght@100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/erxes-logo.svg" />
    <link rel="icon" type="image/x-icon" href="/assets/erxes-logo.ico" />
  </head>
  <body class="font-sans text-base">
    <div id="root"></div>
  </body>
</html>
