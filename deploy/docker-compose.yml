# erxes v3 (erxes-next) — minimal self-hosted core stack
#
# ─────────────────────────────────────────────────────────────────────────────
# PROVENANCE / WARNING
# ─────────────────────────────────────────────────────────────────────────────
# This file is NOT official. As of 2026-07-30 the erxes project ships NO
# docker-compose.yml for v3.x anywhere (not in erxes/erxes, not in erxes/
# erxes-next, not as a release asset, not on docs.erxes.io). Every published
# erxes "self-hosting" doc describes the PRE-REWRITE v2 architecture.
#
# This compose was hand-derived from, in the v3 source tree at commit badf583:
#   backend/core-api/Dockerfile              -> CMD node dist/src/main.js, /app
#   backend/gateway/Dockerfile               -> apollo-router embedded, :4000
#   frontend/core-ui/Dockerfile              -> nginx, :80, REACT_APP_* -> window.env
#   frontend/core-ui/docker-entrypoint.sh    -> runtime env injection via `jo`
#   backend/erxes-api-shared/src/utils/service-discovery.ts
#   backend/erxes-api-shared/src/utils/redis.ts
#   backend/erxes-api-shared/src/utils/mongo/{mongo-connection,generate-models}.ts
#   backend/gateway/src/proxy/{targets,middleware}.ts
#
# ─────────────────────────────────────────────────────────────────────────────
# THE SERVICE NAME `plugin-core-api` IS LOAD-BEARING. DO NOT RENAME IT.
# ─────────────────────────────────────────────────────────────────────────────
# service-discovery.ts joinErxesGateway() computes, when NODE_ENV=production
# and LOAD_BALANCER_ADDRESS is unset:
#     address = `http://plugin-${name}-api:${port}`
# core-api registers with name='core' (core-api/src/main.ts: PLUGIN_NAME='core')
# and port 3300, so it publishes `http://plugin-core-api:3300` into Redis under
# key `erxes-service-core`. The gateway reads that key back and proxies to it
# verbatim (proxy/targets.ts + proxy/middleware.ts applyProxyToCore, which uses
# core.address when NODE_ENV=production). So DNS must resolve `plugin-core-api`.
# Any future plugin must likewise be named `plugin-<name>-api`.

services:
  # ── Datastores ────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4-alpine
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
       "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 256M

  # ── core-api ──────────────────────────────────────────────────────────────
  # MUST be named plugin-core-api (see header).
  plugin-core-api:
    image: erxes/erxes-next-core-api:${ERXES_VERSION}
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NODE_ENV: production
      # VERSION=os selects the single-tenant path in generate-models.ts
      # (VERSION==='saas' would require a core Organizations collection).
      VERSION: os
      PORT: "3300"
      # Written to redis as 'hostname' and used to build links back to the app.
      DOMAIN: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # ENABLED_PLUGINS / ENABLED_PLUGINS_ONLY_API are deliberately NOT SET.
      # They must be absent, never "". getPlugins() does
      #   ['core', ...(process.env.ENABLED_PLUGINS?.split(',') || [])]
      # and ''.split(',') === [''], so an empty string yields ['core', ''] —
      # an unnamed phantom plugin. Verified by running this stack: the gateway
      # then logs "Waiting for plugin  to join service discovery" forever and
      # never serves /graphql. Unset yields ['core']. Do not "helpfully" add
      # these back as empty strings.
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # erxes resolves storage config as `configs[CODE] ?? getEnv(CODE)`
      # (erxes-api-shared/src/utils/file/upload.ts readConfigValue), so these env
      # vars act as the fallback when the org Configs collection has nothing set.
      # Using the AWS_* S3-compatible path rather than CLOUDFLARE_*: it needs only
      # an endpoint + path-style and no Cloudflare API token / account hash.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1536
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  # ── gateway ───────────────────────────────────────────────────────────────
  # Embeds Apollo Router v1.59.2 as a child process and composes the supergraph
  # with rover at boot. Runs as root, which it needs: it writes router.yaml /
  # supergraph.graphql into dist/src/apollo-router/temp and downloads plugin
  # subscription bundles into dist/src/subscription/plugins/downloads — both
  # inside a tree the Dockerfile copied with --chmod=0555.
  gateway:
    image: erxes/erxes-next-gateway:${ERXES_VERSION}
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      plugin-core-api: {condition: service_started}
    environment:
      NODE_ENV: production
      VERSION: os
      PORT: "4000"
      # DOMAIN is used as a CORS origin (main.ts seeds corsOptions.origin from
      # DOMAIN + WIDGETS_DOMAIN, and only adds localhost when NODE_ENV=
      # development). It must therefore be the UI origin, not the API origin.
      DOMAIN: https://${ERXES_UI_DOMAIN}
      ALLOWED_DOMAINS: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # NOT SET on purpose — see the long note on plugin-core-api. An empty
      # string here is what makes the gateway hang on a nameless plugin.
      # Bound the service-discovery retry loop. Unset => MAX_SAFE_INTEGER, i.e.
      # the gateway retries forever instead of failing visibly (targets.ts).
      MAX_PLUGIN_RETRY: "60"
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # erxes resolves storage config as `configs[CODE] ?? getEnv(CODE)`
      # (erxes-api-shared/src/utils/file/upload.ts readConfigValue), so these env
      # vars act as the fallback when the org Configs collection has nothing set.
      # Using the AWS_* S3-compatible path rather than CLOUDFLARE_*: it needs only
      # an endpoint + path-style and no Cloudflare API token / account hash.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1024
    restart: unless-stopped
    networks: [erxes, dokploy-network]
    # ── Routing is owned by DOKPLOY, not this file ────────────────────────────
    # Do NOT add traefik.* labels here. Dokploy generates the routers from its
    # own Domain records (dynamic/<appName>.yml) — adding labels too creates a
    # SECOND router for the same Host, and Traefik then refuses to bind it:
    #   "Router erxes-gw cannot be linked automatically with multiple Services"
    # (observed live). It also bypasses per-domain settings like middlewares.
    # Register hostnames in Dokploy instead; see deploy/README.md.
    #
    # TWO HOSTNAMES ARE REQUIRED — do not try to collapse these onto one host
    # with PathPrefix rules. The gateway is a CATCH-ALL reverse proxy:
    # proxy/middleware.ts applyProxyToCore mounts app.use('/', ...) onto core,
    # so core-api's own routes are served from the gateway root. Enumerated from
    # backend/core-api/src (router.get/post) that means at minimum
    #   /initial-setup /get-frontend-plugins /core-login /sso-callback
    #   /ml-callback /oauth/* /upload-chunked/* /import-export/* /print /telnyx
    # plus the gateway's own /health, /locales/:lng/:file, /pl:serviceName.
    # Those overlap the UI's own client-side routes, so a single-host path split
    # cannot separate them unambiguously. The UI reads ONE base URL
    # (REACT_APP_API_URL) and derives both `${base}/graphql` and
    # `${base}/initial-setup` from it (core-ui/src/providers/apollo-provider/
    # apolloClient.ts and OrganizationProviderEffect.tsx), so that base must be
    # a host where the gateway owns `/`.
    #   gateway -> ERXES_API_DOMAIN, port 4000
    #   core-ui -> ERXES_UI_DOMAIN,  port 80
    deploy:
      resources:
        limits:
          memory: 1G

  # ── core-ui ───────────────────────────────────────────────────────────────
  # Static nginx bundle. docker-entrypoint.sh serialises every REACT_APP_* env
  # var into /js/env.js as window.env at container start, so the API URL is a
  # runtime knob and this image needs no rebuild per domain.
  core-ui:
    image: erxes/erxes-next-ui:${ERXES_VERSION}
    depends_on:
      gateway: {condition: service_started}
    environment:
      # config/index.ts reads window.env.REACT_APP_API_URL -> must be the
      # PUBLIC gateway origin (browser-reachable), not an internal DNS name.
      # MUST point at the GATEWAY host. The UI derives both `${base}/graphql`
      # (apolloClient.ts, incl. the ws:// subscription URL) and
      # `${base}/initial-setup` from this single value.
      REACT_APP_API_URL: https://${ERXES_API_DOMAIN}
      REACT_APP_SERVER_BASE_URL: https://${ERXES_API_DOMAIN}
      # The baked nginx vhost is `server_name *.next.erxes.io` with literal
      # ${NGINX_HOST}/${NGINX_PORT} placeholders the entrypoint sed-replaces.
      NGINX_HOST: ${ERXES_UI_DOMAIN}
      NGINX_PORT: "80"
    # ---------------------------------------------------------------------
    # Sharks Marketing white-label overlay.
    #
    # The upstream `erxes/erxes-next-ui` image has NO runtime branding hook:
    # the entrypoint only injects REACT_APP_* into window.env, and neither
    # the page <title> nor the favicon paths are configurable. There are also
    # no `build:` directives anywhere in this compose, so patching this repo
    # cannot change image contents. Bind-mounting the three branded files
    # over the served docroot is therefore the only no-rebuild option.
    #
    # !!!!!!!!!!!!!!!!!!!!!!!!  READ BEFORE UPGRADING  !!!!!!!!!!!!!!!!!!!!!!
    # index.html is VERSION-LOCKED to ERXES_VERSION. It hard-references the
    # content-hashed entry bundle (currently `main.8ef9f40b.js`). If you bump
    # ERXES_VERSION, the new image ships a NEW bundle hash and this stale
    # mounted index.html will point at a bundle that no longer exists ->
    # BLANK WHITE SPA. On every version bump you MUST regenerate it:
    #
    #   docker run --rm --entrypoint cat erxes/erxes-next-ui:<NEW_VERSION> \
    #     /usr/share/nginx/html/index.html > /opt/sharks-branding/erxes/index.html
    #   sed -i 's|<title>erxes</title>|<title>Sharks Marketing</title>|' \
    #     /opt/sharks-branding/erxes/index.html
    #
    # Change ONLY the <title>; everything else must stay byte-identical.
    #
    # The :ro flags are safe despite the entrypoint's `sed -i` on index.html:
    # that sed is guarded by `if ! grep -q "/js/env.js"`, and our copy already
    # contains the `<script src="/js/env.js">` tag, so the guard short-circuits
    # and no write is ever attempted. Keep that tag when regenerating (it is
    # appended after </html> by the entrypoint on a stock image, so a `cat`
    # from a fresh image will NOT have it -- re-append it manually):
    #     printf '    <script src="/js/env.js"></script>\n' >> index.html
    #
    # The two logo files keep their upstream `erxes-logo.*` filenames on
    # purpose -- index.html and the built bundles reference those exact paths.
    # ---------------------------------------------------------------------
    volumes:
      - /opt/sharks-branding/erxes/index.html:/usr/share/nginx/html/index.html:ro
      - /opt/sharks-branding/erxes/erxes-logo.svg:/usr/share/nginx/html/assets/erxes-logo.svg:ro
      - /opt/sharks-branding/erxes/erxes-logo.ico:/usr/share/nginx/html/assets/erxes-logo.ico:ro
    restart: unless-stopped
    networks: [erxes, dokploy-network]
    # No traefik.* labels here either — Dokploy owns routing. See the note on
    # the gateway service above.
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo-data:
  redis-data:

networks:
  erxes:
  dokploy-network:
    external: true
