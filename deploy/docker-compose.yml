# erxes v3 (erxes-next) — minimal self-hosted core stack
#
# ─────────────────────────────────────────────────────────────────────────────
# PROVENANCE / WARNING
# ─────────────────────────────────────────────────────────────────────────────
# This file is NOT official. As of 2026-07-30 the erxes project ships NO
# docker-compose.yml for v3.x anywhere (not in erxes/erxes, not in erxes/
# erxes-next, not as a release asset, not on docs.erxes.io). Every published
# erxes "self-hosting" doc describes the PRE-REWRITE v2 architecture.
#
# This compose was hand-derived from, in the v3 source tree at commit badf583:
#   backend/core-api/Dockerfile              -> CMD node dist/src/main.js, /app
#   backend/gateway/Dockerfile               -> apollo-router embedded, :4000
#   frontend/core-ui/Dockerfile              -> nginx, :80, REACT_APP_* -> window.env
#   frontend/core-ui/docker-entrypoint.sh    -> runtime env injection via `jo`
#   backend/erxes-api-shared/src/utils/service-discovery.ts
#   backend/erxes-api-shared/src/utils/redis.ts
#   backend/erxes-api-shared/src/utils/mongo/{mongo-connection,generate-models}.ts
#   backend/gateway/src/proxy/{targets,middleware}.ts
#
# ─────────────────────────────────────────────────────────────────────────────
# THE SERVICE NAME `plugin-core-api` IS LOAD-BEARING. DO NOT RENAME IT.
# ─────────────────────────────────────────────────────────────────────────────
# service-discovery.ts joinErxesGateway() computes, when NODE_ENV=production
# and LOAD_BALANCER_ADDRESS is unset:
#     address = `http://plugin-${name}-api:${port}`
# core-api registers with name='core' (core-api/src/main.ts: PLUGIN_NAME='core')
# and port 3300, so it publishes `http://plugin-core-api:3300` into Redis under
# key `erxes-service-core`. The gateway reads that key back and proxies to it
# verbatim (proxy/targets.ts + proxy/middleware.ts applyProxyToCore, which uses
# core.address when NODE_ENV=production). So DNS must resolve `plugin-core-api`.
# Any future plugin must likewise be named `plugin-<name>-api`.
#
# ─────────────────────────────────────────────────────────────────────────────
# FRONTLINE IS BUILT FROM SOURCE, NOT PULLED
# ─────────────────────────────────────────────────────────────────────────────
# NOT because no image exists. `erxes/erxes-next-frontline_api` DOES exist and
# has 540 tags including 3.0.61 and 3.0.62, multi-arch amd64+arm64. Note the
# UNDERSCORE: the other services here follow `erxes-next-<name>-api`, but the
# plugin CI workflows publish `erxes-next-<name>_api`
# (.github/workflows/ci-api-frontline.yml). Checking the hyphenated name gives
# a false "does not exist" — that spelling genuinely has no repo.
#
# We build from source because that published image is UPSTREAM's. `origin` on
# this repo is github.com/hypedrive-app/erxes, a FORK, and the WhatsApp + Plivo
# integrations (merge c19464f) exist only here. erxes' own CI builds
# erxes/erxes-next-frontline_api from erxes/erxes main, so pulling any tag of
# it would silently ship a frontline WITHOUT our integrations — and worse, its
# GraphQL schema would differ from what our frontline_ui expects.
#
# So: pinning a published tag is not an option, and `build:` is mandatory.
# Dokploy already clones this repo to deploy the stack, so the context is local.
#
# BUILD CONTEXT IS THE REPO ROOT (`context: ..`), not deploy/. Nx, the pnpm
# workspace and tsconfig.base.json aliases only resolve from the root.
#
# It uses Dockerfile.build, NOT the sibling Dockerfile. The latter only COPYs a
# pre-existing dist/ (which is gitignored) and cannot build from a clean
# checkout. See the header of backend/plugins/frontline_api/Dockerfile.build.

services:
  # ── Datastores ────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7.4-alpine
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD}",
       "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 256M

  # ── core-api ──────────────────────────────────────────────────────────────
  # MUST be named plugin-core-api (see header).
  plugin-core-api:
    # Built from source, NOT `image: erxes/erxes-next-core-api:${ERXES_VERSION}`.
    # That published image is UPSTREAM's build and predates commit 2957355,
    # which made GET /get-frontend-plugins derive each Module Federation remote
    # from PLUGIN_CDN_URL (see that env var below) instead of a hardcoded
    # https://plugins.erxes.io. Verified on the live box: the env var is set
    # correctly in the container yet /get-frontend-plugins still answered with
    # plugins.erxes.io URLs, because the compiled code in the pulled image has
    # the literal. Same reasoning as frontline — see the header note.
    #
    # Dockerfile.build, NOT the sibling Dockerfile: the latter only COPYs a
    # pre-existing dist/ (gitignored) and cannot build from a clean checkout.
    build:
      context: ..
      dockerfile: backend/core-api/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NODE_ENV: production
      # VERSION=os selects the single-tenant path in generate-models.ts
      # (VERSION==='saas' would require a core Organizations collection).
      VERSION: os
      PORT: "3300"
      # Written to redis as 'hostname' and used to build links back to the app.
      DOMAIN: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}

      # ── OIDC login (optional) ────────────────────────────────────────────
      # Lets an external OpenID Connect provider log users in, which erxes has
      # no supported path for on a self-hosted instance: its own SSO is
      # WorkOS-brokered and hard-gated behind VERSION=saas.
      #
      # The three values below are the switch -- leave any of them empty and
      # `/auth/oidc/*` answers 404, so an unconfigured deployment is unchanged
      # and password login is untouched either way. Sign-in starts at
      #   https://<api domain>/auth/oidc/login
      # OIDC_REDIRECT_URI must match a redirect URI registered with the
      # provider EXACTLY, and points at the API host (this service), not the UI.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # Where to send the browser after login. Defaults to DOMAIN (the UI).
      OIDC_APP_DOMAIN: ${OIDC_APP_DOMAIN:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      # Off by default: with a shared identity provider, auto-creating users
      # would hand an erxes seat to anyone who can log in there, and they would
      # arrive with no permission groups at all. Turning it on REQUIRES
      # OIDC_ALLOWED_EMAIL_DOMAINS -- an empty list refuses every address.
      OIDC_ALLOW_JIT_PROVISION: ${OIDC_ALLOW_JIT_PROVISION:-false}
      OIDC_ALLOWED_EMAIL_DOMAINS: ${OIDC_ALLOWED_EMAIL_DOMAINS:-}

      # ── ENABLED_PLUGINS ──────────────────────────────────────────────────
      # A NON-EMPTY, comma-separated list of plugin names, or ABSENT. Never "".
      # getPlugins() (erxes-api-shared/src/utils/service-discovery.ts) does
      #   ['core', ...(process.env.ENABLED_PLUGINS?.split(',') || [])]
      # and ''.split(',') === [''], so an empty string yields ['core', ''] —
      # an unnamed phantom plugin. Verified by running this stack: the gateway
      # then logs "Waiting for plugin  to join service discovery" forever and
      # never serves /graphql. That is why this defaults to a non-empty
      # `frontline,sales,operation` and NOT `${ENABLED_PLUGINS:-}`.
      #
      # Each name must match the startPlugin({name:...}) literal in that
      # plugin's src/main.ts, because the gateway derives the Redis discovery
      # key `erxes-service-<name>` from this list. Verified against source:
      #   frontline -> backend/plugins/frontline_api/src/main.ts (port 3304)
      #   sales     -> backend/plugins/sales_api/src/main.ts     (port 3305)
      #   operation -> backend/plugins/operation_api/src/main.ts (port 3307)
      # The names are the BARE plugin names, NOT the `_api` directory names —
      # `sales_api` here would make the gateway wait forever on a discovery key
      # nothing ever publishes.
      #
      # core-api ALSO uses this list to answer GET /get-frontend-plugins, which
      # is what tells the browser which Module Federation remotes to load
      # (frontend/core-ui/src/bootstrap.tsx). Each name in this list yields one
      # remote entry URL built from PLUGIN_CDN_URL below, so a plugin listed
      # here MUST have its UI served from there or the browser 404s on it.
      # That is why every name here MUST also be built into the `plugins-ui`
      # service below (one image, one `/latest/<plugin>_ui/` directory per
      # plugin — see frontend/plugins/Dockerfile.plugins), and why EVERY
      # ENABLED_PLUGINS occurrence in this file (core-api, each plugin api, and
      # the gateway) must stay identical — the gateway compares its list
      # against what the plugins actually registered.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # ENABLED_PLUGINS_ONLY_API stays ABSENT — same empty-string trap.
      # ── PLUGIN_CDN_URL: where the BROWSER fetches plugin remotes ─────────
      # routes.ts builds `${PLUGIN_CDN_URL}/${version}/${plugin}_ui/remoteEntry.js`
      # and core-ui hands that string to Module Federation's runtime init(),
      # so it is dereferenced BY THE BROWSER. It must therefore be a public,
      # TLS-terminated origin — `http://plugins-ui` (the compose DNS name)
      # would resolve only inside the docker network and fail in the browser,
      # and any http:// value would be blocked as mixed content on an https
      # page. Default is upstream's CDN, which serves upstream's build and NOT
      # our WhatsApp/Plivo fork — so this must be set for frontline to work.
      #
      # It is ONE base URL and the PATH selects the plugin, which is why all
      # the remotes come from ONE origin. See the plugins-ui service and
      # deploy/README.md.
      PLUGIN_CDN_URL: https://${ERXES_PLUGINS_DOMAIN}
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # erxes resolves storage config as `configs[CODE] ?? getEnv(CODE)`
      # (erxes-api-shared/src/utils/file/upload.ts readConfigValue), so these env
      # vars act as the fallback when the org Configs collection has nothing set.
      # Using the AWS_* S3-compatible path rather than CLOUDFLARE_*: it needs only
      # an endpoint + path-style and no Cloudflare API token / account hash.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1536
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  # ── frontline plugin api (WhatsApp + Plivo, inbox, tickets) ───────────────
  # MUST be named plugin-frontline-api. joinErxesGateway() publishes
  #   http://plugin-${name}-api:${port}  ->  http://plugin-frontline-api:3304
  # into Redis under `erxes-service-frontline` when NODE_ENV=production and
  # LOAD_BALANCER_ADDRESS is unset. The gateway proxies to that string
  # verbatim, so the compose service name IS the DNS name it dials. Renaming
  # this service silently breaks the gateway with no error at build time.
  plugin-frontline-api:
    # Built from source — no published image exists. See the header note.
    build:
      context: ..
      dockerfile: backend/plugins/frontline_api/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      # core-api owns the shared collections (users, orgs, permissions) and
      # seeds them on first boot; frontline reads them immediately.
      plugin-core-api: {condition: service_started}
    environment:
      NODE_ENV: production
      VERSION: os
      # Must equal the port in startPlugin({name:'frontline', port:3304})
      # (backend/plugins/frontline_api/src/main.ts). The value published to
      # Redis comes from that literal, NOT from this env var — they are wired
      # independently, so a mismatch here yields a registered address that
      # nothing is listening on. Keep them in lockstep.
      PORT: "3304"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      # ── PLIVO_CALLBACK_PUBLIC_URL: the origin Plivo is told to call ──────
      # Plivo signs its callbacks over the URL it was REGISTERED with, and we
      # verify by rebuilding that URL — so the two must be the same string or
      # every callback 403s and the call dies with "Error Reaching Answer URL".
      #
      # DOMAIN cannot serve here: it is the UI origin (see the CORS note on the
      # gateway), which answers 405 on the webhook paths. The webhooks are
      # reached through the gateway on the API origin, under the plugin's
      # `/pl:frontline` mount, and that prefix is part of what Plivo signs.
      PLIVO_CALLBACK_PUBLIC_URL: https://${ERXES_API_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Same secret as core-api and the gateway — frontline validates the same
      # user JWTs, so a divergent value rejects every authenticated request.
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # Same non-empty rule as everywhere else in this file. frontline itself
      # calls isEnabled()/getPlugins() for cross-plugin checks.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # Frontline needs these in its own right, not just for parity: inbound
      # WhatsApp media and email (imap) attachments are streamed straight to
      # object storage by this process. Same readConfigValue fallback chain as
      # core-api — see the note on plugin-core-api.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1536
    # Defined in Dockerfile.build; restated here so it is visible at the level
    # the `gateway` depends_on condition below actually reads, and so it still
    # applies if the image is ever swapped for a published one.
    #
    # This gates the gateway (see its depends_on) and is the difference between
    # "gateway waits for a slow frontline" and "gateway burns its 60 retries and
    # exits". /health only answers after start-plugin.ts has mounted /graphql
    # and called httpServer.listen(), so it is a genuine readiness signal for
    # the federation introspection the gateway is about to perform.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3304)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: first boot registers mongoose models and connects Redis on a
      # cold, memory-limited box. Too short here re-creates the very failure
      # this healthcheck exists to prevent.
      start_period: 180s
    restart: unless-stopped
    # `erxes` ONLY — deliberately NOT on dokploy-network. This plugin is never
    # addressed from the internet: the browser talks to the gateway, which
    # proxies /pl:frontline to it over the internal network. Webhook callbacks
    # from Meta/Plivo likewise arrive at the gateway host. Putting it on
    # dokploy-network would expose it to Traefik for no reason.
    networks: [erxes]
    # NO traefik.* labels — Dokploy owns routing. See the gateway service.
    deploy:
      resources:
        limits:
          memory: 1G

  # ── sales plugin api (deals, pipelines, forecasts) ────────────────────────
  # MUST be named plugin-sales-api. joinErxesGateway() publishes
  #   http://plugin-${name}-api:${port}  ->  http://plugin-sales-api:3305
  # into Redis under `erxes-service-sales` when NODE_ENV=production and
  # LOAD_BALANCER_ADDRESS is unset. The gateway proxies to that string
  # verbatim, so the compose service name IS the DNS name it dials. Renaming
  # this service silently breaks the gateway with no error at build time.
  plugin-sales-api:
    # Built from source. An `erxes/erxes-next-sales_api` image DOES exist
    # upstream (note the UNDERSCORE — the hyphenated spelling has no repo), but
    # it is built from erxes/erxes main, not this fork, so its GraphQL schema
    # need not match our sales_ui. Same reasoning as frontline — see the header.
    #
    # Dockerfile.build, NOT the sibling Dockerfile: the latter only COPYs a
    # pre-existing dist/ (gitignored) and cannot build from a clean checkout.
    # See the header of backend/plugins/sales_api/Dockerfile.build.
    build:
      context: ..
      dockerfile: backend/plugins/sales_api/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      # core-api owns the shared collections (users, orgs, permissions) and
      # seeds them on first boot; sales reads them immediately.
      plugin-core-api: {condition: service_started}
    environment:
      NODE_ENV: production
      VERSION: os
      # Must equal the port in startPlugin({name:'sales', port:3305})
      # (backend/plugins/sales_api/src/main.ts). The value published to Redis
      # comes from that literal, NOT from this env var — they are wired
      # independently, so a mismatch here yields a registered address that
      # nothing is listening on. Keep them in lockstep.
      PORT: "3305"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Same secret as core-api and the gateway — sales validates the same user
      # JWTs, so a divergent value rejects every authenticated request.
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # Same non-empty rule as everywhere else in this file. sales itself calls
      # isEnabled()/getPlugins() for cross-plugin checks.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # Deal attachments and import/export artifacts are streamed to object
      # storage by this process. Same readConfigValue fallback chain as
      # core-api — see the note on plugin-core-api.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1536
    # Defined in Dockerfile.build; restated here so it is visible at the level
    # the `gateway` depends_on condition below actually reads. Same role as
    # frontline's — see that service for why this gate is the difference
    # between "gateway waits" and "gateway exits having served nothing".
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3305)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    # `erxes` ONLY — deliberately NOT on dokploy-network. This plugin is never
    # addressed from the internet: the browser talks to the gateway, which
    # proxies /pl:sales to it over the internal network.
    networks: [erxes]
    # NO traefik.* labels — Dokploy owns routing. See the gateway service.
    deploy:
      resources:
        limits:
          memory: 1G

  # ── operation plugin api (tasks, projects) ────────────────────────────────
  # MUST be named plugin-operation-api. joinErxesGateway() publishes
  #   http://plugin-operation-api:3307  ->  Redis `erxes-service-operation`.
  # Same naming contract as plugin-sales-api above.
  plugin-operation-api:
    # Built from source, for the same fork-vs-upstream reason as sales. See the
    # header of backend/plugins/operation_api/Dockerfile.build for why this is
    # Dockerfile.build and not the sibling packaging-only Dockerfile.
    build:
      context: ..
      dockerfile: backend/plugins/operation_api/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      plugin-core-api: {condition: service_started}
    environment:
      NODE_ENV: production
      VERSION: os
      # Must equal the port in startPlugin({name:'operation', port:3307})
      # (backend/plugins/operation_api/src/main.ts). Wired independently from
      # the literal — keep them in lockstep.
      PORT: "3307"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # Task attachments and import/export artifacts are streamed to object
      # storage by this process. Same readConfigValue fallback chain as
      # core-api — see the note on plugin-core-api.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1536
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3307)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  plugin-calcom-api:
    # Built from source — there is no published image for this plugin at all,
    # it exists only in this fork. See backend/plugins/calcom_api/Dockerfile.build.
    build:
      context: ..
      dockerfile: backend/plugins/calcom_api/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      plugin-core-api: {condition: service_started}
    environment:
      NODE_ENV: production
      VERSION: os
      # Must equal the port in startPlugin({name:'calcom', port:3314})
      # (backend/plugins/calcom_api/src/main.ts). 3314 and not the plugin
      # generator's default 33010, which insurance_api already claims.
      PORT: "3314"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}

      # ── Cal.com integration ──────────────────────────────────────────────
      # Shared secret configured on the Cal.com webhook subscription. The
      # receiver HMACs the raw request body with it and compares against
      # X-Cal-Signature-256; an unset value makes every delivery fail
      # verification and answer 401, which is the correct closed default —
      # accepting unsigned webhooks would let anyone write into the CRM.
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-}
      # Cal.com API key, used for the outbound direction only: cancel,
      # reschedule, mark-absent, and the reconciliation backfill. Inbound
      # webhooks do not need it, so the mirror still fills without one.
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      # Defaults to Cal.com Cloud. Point at a self-hosted instance's /v2 if the
      # calendar is the one we run at cal.sharksmarketing.com.
      CALCOM_API_URL: ${CALCOM_API_URL:-https://api.cal.com/v2}
      # Guards POST /calcom/reconcile, which drives a loop of outbound API
      # calls and CRM writes. Unset means the route answers 503 rather than
      # running unauthenticated — see the comment on the route in routes.ts.
      CALCOM_ADMIN_TOKEN: ${CALCOM_ADMIN_TOKEN:-}

      NODE_OPTIONS: --max-old-space-size=1536
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3314)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 1G

  # ── gateway ───────────────────────────────────────────────────────────────
  # Embeds Apollo Router v1.59.2 as a child process and composes the supergraph
  # with rover at boot. Runs as root, which it needs: it writes router.yaml /
  # supergraph.graphql into dist/src/apollo-router/temp and downloads plugin
  # subscription bundles into dist/src/subscription/plugins/downloads. (The
  # sibling Dockerfile copies that tree --chmod=0555 and relies on root to
  # write it anyway; Dockerfile.build below copies it writable instead, but
  # still runs as root because both paths must create directories.)
  gateway:
    # Built from source, NOT `image: erxes/erxes-next-gateway:${ERXES_VERSION}`.
    # That published image is UPSTREAM's build, and the gateway is the process
    # that serves GET /locales/:lng/:file — src/util/locales.ts readLocalLocale
    # reads `path.join(__dirname, '../locales')` off THIS container's own disk,
    # so every translated string the whole UI renders comes out of this image.
    # Our fork's backend/gateway/src/locales/en/frontline.json has 1288 keys
    # including "plivo-softphone": "Browser phone"; the pulled 3.0.61 image has
    # 1173 and lacks that key entirely — verified by running it:
    #   docker run --rm erxes/erxes-next-gateway:3.0.61 node -e \
    #     "console.log(Object.keys(require('/app/backend/gateway/dist/src/locales/en/frontline.json')).length)"
    #   -> 1173
    # so the softphone launcher's accessible label rendered as the raw key
    # `plivo-softphone` in production (i18next echoes the key when the bundle
    # has no entry, which is why it surfaced as literal text, not an error).
    # Same class of bug as core-api's PLUGIN_CDN_URL above — see that note.
    #
    # Dockerfile.build, NOT the sibling Dockerfile. Unlike core-api's and
    # frontline's siblings, this one CAN compile from a clean checkout, but it
    # COPYs a curated file list (the nx inference-plugin trap), omits
    # NX_SOCKET_DIR, and runs a bare `pnpm install` instead of
    # --frozen-lockfile. See the header of backend/gateway/Dockerfile.build.
    build:
      context: ..
      dockerfile: backend/gateway/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      plugin-core-api: {condition: service_started}
      # ── THIS IS A CORRECTNESS REQUIREMENT, NOT AN OPTIMISATION ─────────────
      # (An earlier revision of this file called it "not a correctness
      # requirement — the gateway retries either way". That was wrong, and the
      # reason is worth spelling out, because the failure it causes is a FULL
      # OUTAGE of core GraphQL, not a missing frontline feature.)
      #
      # backend/gateway/src/proxy/targets.ts:
      #   export async function retryGetProxyTargets() {
      #     try { ... await Promise.all(serviceNames.map(retryGetProxyTarget));
      #           await Promise.all(proxyTargets.map(retryEnsureGraphqlEndpointIsUp));
      #     } catch (e) { console.error(e); process.exit(1); }   <-- HERE
      #   }
      #
      # The retry budget is NOT "retry then continue degraded". When
      # MAX_PLUGIN_RETRY is exhausted, retry() rethrows, the catch runs
      # process.exit(1), and main.ts never reaches httpServer.listen(). The
      # gateway serves NOTHING — not /graphql, not /health, not the core-api
      # passthrough that /initial-setup and /core-login ride on. Combined with
      # `restart: unless-stopped` that is a permanent crash-loop, not a
      # 60-second blip: each restart re-enters the same doomed wait.
      #
      # service_healthy (not service_started) is what makes the wait finite and
      # correct. A container that has merely STARTED may still be 3 minutes from
      # serving /graphql — the frontline image runs mongoose model registration
      # first — and the gateway would spend its whole 60-try budget against a
      # process that was always going to come up. Waiting for HEALTHY spends
      # Docker's patience (start_period 180s + 12x10s) instead of the gateway's.
      #
      # This does NOT hide a broken frontline: if it never goes healthy, the
      # gateway stays in `Created` and `docker compose ps` shows
      # plugin-frontline-api as (unhealthy). The failure is attributed to the
      # service that actually failed. To recover, drop frontline from
      # ENABLED_PLUGINS — see the rollback runbook in deploy/README.md.
      plugin-frontline-api: {condition: service_healthy}
      # Same reasoning applies to every OTHER name in ENABLED_PLUGINS, not just
      # frontline: retryGetProxyTargets() blocks on ALL of them and exits(1) if
      # ANY is still missing. sales and operation are in that list now, so they
      # get the same service_healthy gate — omitting it would leave the gateway
      # racing two more cold-booting plugins with the same finite 60-try budget.
      plugin-sales-api: {condition: service_healthy}
      plugin-operation-api: {condition: service_healthy}
      # calcom gets the same gate for the same reason. Note the coupling this
      # creates, because compose cannot express "only if enabled": this
      # depends_on is UNCONDITIONAL, so the gateway waits for
      # plugin-calcom-api to go healthy even when `calcom` is absent from
      # ENABLED_PLUGINS. That is a wait, not a deadlock — the plugin boots and
      # becomes healthy regardless of whether the gateway is looking for it —
      # but it does mean the SERVICE and the ENV LIST must be removed together.
      # To drop calcom entirely: delete `calcom` from ENABLED_PLUGINS, delete
      # this line, and delete the plugin-calcom-api service. Removing only the
      # name from ENABLED_PLUGINS leaves a container nothing talks to; removing
      # only the service makes compose fail to start on an unknown dependency.
      plugin-calcom-api: {condition: service_healthy}
    environment:
      NODE_ENV: production
      VERSION: os
      PORT: "4000"
      # DOMAIN is used as a CORS origin (main.ts seeds corsOptions.origin from
      # DOMAIN + WIDGETS_DOMAIN, and only adds localhost when NODE_ENV=
      # development). It must therefore be the UI origin, not the API origin.
      DOMAIN: https://${ERXES_UI_DOMAIN}
      ALLOWED_DOMAINS: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # MUST be the SAME value as plugin-core-api's. This is the list the
      # gateway iterates in proxy/targets.ts retryGetProxyTargets(): for each
      # name it blocks until `erxes-service-<name>` appears in Redis AND that
      # address answers a federation SubgraphIntrospectQuery on /graphql. If
      # frontline is listed here but plugin-frontline-api never starts, the
      # gateway will not serve /graphql at all — core included. The same is now
      # true of sales and operation: each name added here is one more subgraph
      # the gateway REQUIRES before it will serve anything.
      # Still never "" — see the long note on plugin-core-api.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # Bound the service-discovery retry loop. Unset => MAX_SAFE_INTEGER, i.e.
      # the gateway waits forever instead of failing visibly (targets.ts).
      #
      # DO NOT read this as a safety valve. Exhausting the budget does NOT
      # start the gateway without the failed plugin — retry() rethrows and
      # retryGetProxyTargets()'s catch calls process.exit(1), so the gateway
      # dies having served nothing at all. `restart: unless-stopped` then
      # replays the same doomed wait: a CRASH-LOOP, not a recovery. What this
      # value actually controls is how fast the failure becomes VISIBLE in the
      # logs (60 x 1s) rather than hanging silently forever. The thing that
      # keeps a slow-but-healthy frontline from tripping it is the
      # `service_healthy` gate above, not this number.
      MAX_PLUGIN_RETRY: "60"
      # ── File storage: S3-compatible (Cloudflare R2) ──────────────────────
      # erxes resolves storage config as `configs[CODE] ?? getEnv(CODE)`
      # (erxes-api-shared/src/utils/file/upload.ts readConfigValue), so these env
      # vars act as the fallback when the org Configs collection has nothing set.
      # Using the AWS_* S3-compatible path rather than CLOUDFLARE_*: it needs only
      # an endpoint + path-style and no Cloudflare API token / account hash.
      UPLOAD_SERVICE_TYPE: ${UPLOAD_SERVICE_TYPE:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_PREFIX: ${AWS_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_COMPATIBLE_SERVICE_ENDPOINT: ${AWS_COMPATIBLE_SERVICE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_FORCE_PATH_STYLE: ${AWS_FORCE_PATH_STYLE:-}
      # R2 rejects ACL headers outright — without this every upload 400s.
      AWS_DISABLE_ACL: ${AWS_DISABLE_ACL:-}
      FILE_SYSTEM_PUBLIC: ${FILE_SYSTEM_PUBLIC:-}
      NODE_OPTIONS: --max-old-space-size=1024
    restart: unless-stopped
    networks: [erxes, dokploy-network]
    # ── Routing is owned by DOKPLOY, not this file ────────────────────────────
    # Do NOT add traefik.* labels here. Dokploy generates the routers from its
    # own Domain records (dynamic/<appName>.yml) — adding labels too creates a
    # SECOND router for the same Host, and Traefik then refuses to bind it:
    #   "Router erxes-gw cannot be linked automatically with multiple Services"
    # (observed live). It also bypasses per-domain settings like middlewares.
    # Register hostnames in Dokploy instead; see deploy/README.md.
    #
    # TWO HOSTNAMES ARE REQUIRED — do not try to collapse these onto one host
    # with PathPrefix rules. The gateway is a CATCH-ALL reverse proxy:
    # proxy/middleware.ts applyProxyToCore mounts app.use('/', ...) onto core,
    # so core-api's own routes are served from the gateway root. Enumerated from
    # backend/core-api/src (router.get/post) that means at minimum
    #   /initial-setup /get-frontend-plugins /core-login /sso-callback
    #   /ml-callback /oauth/* /upload-chunked/* /import-export/* /print /telnyx
    # plus the gateway's own /health, /locales/:lng/:file, /pl:serviceName.
    # Those overlap the UI's own client-side routes, so a single-host path split
    # cannot separate them unambiguously. The UI reads ONE base URL
    # (REACT_APP_API_URL) and derives both `${base}/graphql` and
    # `${base}/initial-setup` from it (core-ui/src/providers/apollo-provider/
    # apolloClient.ts and OrganizationProviderEffect.tsx), so that base must be
    # a host where the gateway owns `/`.
    #   gateway -> ERXES_API_DOMAIN, port 4000
    #   core-ui -> ERXES_UI_DOMAIN,  port 80
    deploy:
      resources:
        limits:
          memory: 1G

  # ── core-ui ───────────────────────────────────────────────────────────────
  # Static nginx bundle. docker-entrypoint.sh serialises every REACT_APP_* env
  # var into /js/env.js as window.env at container start, so the API URL is a
  # runtime knob and this image needs no rebuild per domain.
  core-ui:
    # Built from source, NOT `image: erxes/erxes-next-ui:${ERXES_VERSION}`,
    # because the login screen carries our OIDC sign-in button. The published
    # image hardcodes exactly two login tabs, so an SSO entry point cannot be
    # added to it -- without this the backend's /auth/oidc/* routes work but no
    # one can reach them from the UI.
    image: sharksmarketing/erxes-core-ui:latest
    build:
      context: ..
      dockerfile: frontend/core-ui/Dockerfile
    depends_on:
      gateway: {condition: service_started}
    environment:
      # config/index.ts reads window.env.REACT_APP_API_URL -> must be the
      # PUBLIC gateway origin (browser-reachable), not an internal DNS name.
      # MUST point at the GATEWAY host. The UI derives both `${base}/graphql`
      # (apolloClient.ts, incl. the ws:// subscription URL) and
      # `${base}/initial-setup` from this single value.
      REACT_APP_API_URL: https://${ERXES_API_DOMAIN}
      REACT_APP_SERVER_BASE_URL: https://${ERXES_API_DOMAIN}
      # Label and logo for the OIDC sign-in button. The name is the switch: with
      # it empty the button is not rendered, which is what a deployment without
      # OIDC wants, since the backend routes 404 there anyway. Read at container
      # start into window.env, so changing them needs no rebuild.
      REACT_APP_OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      REACT_APP_OIDC_PROVIDER_ICON_URL: ${OIDC_PROVIDER_ICON_URL:-}
      # Browser tab title, applied to index.html by docker-entrypoint.sh at
      # container start. This replaces the old bind-mounted index.html, which
      # could not survive building our own bundle.
      REACT_APP_APP_TITLE: ${APP_TITLE:-}
      # ── Accent colour ────────────────────────────────────────────────────
      # A hex brand colour. applyRuntimeTheme converts it to oklch and sets
      # --accent-hue/--accent-chroma on <html> before the first paint, which
      # retints all 18 accent tokens (primary, ring, secondary, the chart ramp).
      # Runtime, not build-time: these are plain CSS custom properties resolved
      # by the browser, so one image serves several tenants — same reason
      # APP_TITLE and PLUGIN_CDN_URL are read from window.env rather than baked
      # in. Unset leaves the stylesheet default, which is already the Sharks
      # Marketing blue (#3B90FA). An unparseable value warns in the console and
      # keeps the default rather than producing an unreadable UI.
      REACT_APP_ACCENT_COLOR: ${ACCENT_COLOR:-}
      # Dialing code this deployment dials from, digits only and no `+` (`91` =
      # India). Product-wide default for every phone input, so a number typed
      # without an explicit `+<country>` is read as local. Upstream hardcoded
      # Mongolia; leaving this unset does not restore that, it just means a
      # national-format number stays unformatted until it is set.
      REACT_APP_DEFAULT_PHONE_DIALING_CODE: ${DEFAULT_PHONE_DIALING_CODE:-91}
      # The baked nginx vhost is `server_name *.next.erxes.io` with literal
      # ${NGINX_HOST}/${NGINX_PORT} placeholders the entrypoint sed-replaces.
      NGINX_HOST: ${ERXES_UI_DOMAIN}
      NGINX_PORT: "80"
    # ---------------------------------------------------------------------
    # Sharks Marketing white-label overlay.
    #
    # The upstream `erxes/erxes-next-ui` image has NO runtime branding hook:
    # the entrypoint only injects REACT_APP_* into window.env, and neither
    # the page <title> nor the favicon paths are configurable. There are also
    # core-ui is now built from source (see the `build:` above), so branding
    # that used to require bind-mounting over the served docroot belongs in the
    # source instead. The <title> lives in frontend/core-ui/src/index.html.
    #
    # The version-locked index.html mount that used to sit here has been
    # REMOVED, deliberately. It hard-referenced the content-hashed entry bundle
    # of a specific published image, so building our own bundle would leave it
    # pointing at a file that does not exist -- a blank white SPA. Do not
    # reintroduce it.
    #
    # The two logo files USED to be bind-mounted from /opt/sharks-branding on
    # the host. That is gone, because a host bind-mount of a FILE is a deploy
    # blocker on any machine that does not already have it:
    #
    #   error mounting "/opt/sharks-branding/erxes/erxes-logo.ico" ... :
    #   not a directory: Are you trying to mount a directory onto a file?
    #
    # Docker does not create a missing bind source as a file — it creates it as
    # a DIRECTORY and then fails to mount it over the container's file. So the
    # whole stack builds, every API turns healthy, and then core-ui alone fails
    # to start. It made the compose non-portable: it only ran on the one host
    # those files had been copied to by hand.
    #
    # Branding belongs in the image now that core-ui is built from source (see
    # the `build:` above) — put the logos in frontend/core-ui/src/assets/ and
    # the <title> in frontend/core-ui/src/index.html, where they are versioned
    # with the code and travel to every host.
    # ---------------------------------------------------------------------
    restart: unless-stopped
    networks: [erxes, dokploy-network]
    # No traefik.* labels here either — Dokploy owns routing. See the note on
    # the gateway service above.
    deploy:
      resources:
        limits:
          memory: 256M

  # ── plugins-ui: EVERY Module Federation remote, from ONE origin ───────────
  #
  # Static nginx serving our fork's built frontline_ui, sales_ui and
  # operation_ui bundles side by side under /latest/<plugin>_ui/. This is the
  # container that makes the WhatsApp/Plivo, deals and tasks UIs actually
  # render inside core-ui.
  #
  # ── How a v3 frontend plugin loads (the whole chain) ─────────────────────
  #   1. frontend/core-ui/src/bootstrap.tsx, in the NODE_ENV!=='development'
  #      branch, fetches `${REACT_APP_API_URL}/get-frontend-plugins` and feeds
  #      the response straight into Module Federation's runtime `init({remotes})`.
  #      Remotes are resolved AT RUNTIME from a server response — they are NOT
  #      compiled into core-ui. (frontend/core-ui/module-federation.config.ts
  #      does read ENABLED_PLUGINS into `remotes`, but that is the DEV path;
  #      module-federation.config.prod.ts has no `remotes` key at all.)
  #   2. core-api answers that endpoint from
  #      backend/core-api/src/modules/organization/routes.ts, emitting for each
  #      name in ENABLED_PLUGINS:
  #        { name: `${plugin}_ui`,
  #          entry: `${PLUGIN_CDN_URL}/${version}/${plugin}_ui/remoteEntry.js` }
  #      `version` = getPluginVersion() = `config?.releaseVersion || 'latest'`.
  #   3. The BROWSER then loads that URL. Hence PLUGIN_CDN_URL must be a
  #      PUBLIC origin, not an internal DNS name — see the note below.
  #
  # PLUGIN_CDN_URL previously did not exist; the host was a hardcoded
  # `https://plugins.erxes.io` literal, which served upstream's build (or a
  # 404) rather than our fork's. That is now an env var, and this service is
  # what it points at.
  #
  # ── ONE SERVICE, NOT ONE PER PLUGIN ───────────────────────────────────────
  # Step 2 above is the reason: PLUGIN_CDN_URL is ONE base URL and the PATH
  # selects the plugin. Upstream's own distribution matches — all ten
  # .github/workflows/ci-ui-*.yml sync into the SAME bucket under a per-plugin
  # prefix (s3://erxes-next/$FOLDER/<plugin>_ui/), one CDN host for all of them.
  #
  # This service previously existed three times over (frontline-ui, sales-ui,
  # operation-ui). That shape has no way to be addressed: a hostname per plugin
  # cannot work because PLUGIN_CDN_URL is a single value, and routing one
  # hostname to three containers by path needs a Dokploy PathPrefix Domain,
  # whose `addprefix` middleware re-prepends the prefix the request already
  # carries (/latest/sales_ui/latest/sales_ui/remoteEntry.js -> 404), while
  # `stripprefix` strips the prefix the file actually lives under. Serving all
  # three prefixes from one docroot removes the problem rather than working
  # around it: one hostname, one Dokploy Domain, no middleware. Do NOT split
  # this back out, and do not add Traefik path rules.
  #
  # ── Built from source, like the plugin APIs ───────────────────────────────
  # No published image exists: upstream never containerises a UI plugin, it
  # ships them to R2 behind plugins.erxes.io — which serves UPSTREAM's builds,
  # not our fork's. frontend/plugins/Dockerfile.plugins reproduces the same
  # `<version>/<plugin>_ui/` directory shape locally. See its header; adding a
  # plugin is an edit THERE, not a new service here.
  #
  # ── Build cost: SAFE, unlike the plugin APIs ──────────────────────────────
  # MEASURED per plugin on this tree (/usr/bin/time -v pnpm nx build <p>
  # --skip-nx-cache): frontline_ui peak RSS 1.88 GB / ~48 s / 13 MB of output;
  # sales_ui 1.69 GB / ~21 s / 7.5 MB; operation_ui 1.65 GB / ~14 s / 6.7 MB.
  # The three compiles run SEQUENTIALLY in one image, so peak is the max
  # (~1.9 GB), not the sum — and the `pnpm install` that dominates first-deploy
  # time now happens ONCE instead of three times. The backend plugin builds are
  # REPORTED to peak near 13.9 GB against ~9.9 GB free on the box (not
  # re-measured here); the order-of-magnitude gap is the point, since an OOMed
  # compose build wedges Dokploy's queue (dokploy#4461) with no working Cancel.
  plugins-ui:
    build:
      context: ..
      dockerfile: frontend/plugins/Dockerfile.plugins
    restart: unless-stopped
    # ── MUST be on dokploy-network ────────────────────────────────────────
    # Unlike the plugin APIs, this one IS addressed from the internet: the
    # browser — not the gateway — fetches remoteEntry.js. An internal-only
    # service would be unreachable and every plugin would silently fail to
    # load. Mirrors gateway and core-ui exactly.
    networks: [erxes, dokploy-network]
    # NO traefik.* labels — Dokploy owns routing, same as gateway and core-ui.
    # Register ERXES_PLUGINS_DOMAIN as a Dokploy Domain on THIS service, port
    # 80, with NO path rule. See deploy/README.md.
    deploy:
      resources:
        limits:
          memory: 192M

  # ── automations-service: the engine that actually RUNS automations ────────
  # Without this container an automation can be created, listed and edited, but
  # never executes. Producers across core-api/frontline/sales enqueue onto
  # BullMQ (sendAutomationMessage.ts defaults transport to 'bullmq'), and the
  # ONLY consumer is initMQWorkers() inside this image. The jobs were piling up
  # in a Redis running --maxmemory-policy noeviction.
  #
  # THE SERVICE NAME IS LOAD-BEARING, and the `plugin-<name>-api` rule above
  # does NOT apply. This service never calls joinErxesGateway(); it writes its
  # own address into Redis (services/automations/src/main.ts:84-88):
  #     const address = LOAD_BALANCER_ADDRESS
  #       || `http://${isDev ? 'localhost' : serviceName}:${port}`;
  # with serviceName = 'automations-service'. Rename this key and the address
  # stops resolving.
  #
  # DO NOT add it to ENABLED_PLUGINS. The gateway federation-introspects every
  # name there and process.exit(1)s on failure; this service serves no
  # /graphql, so listing it would take the whole gateway down. It needs no
  # gateway route at all — work arrives over Redis, not HTTP.
  #
  # `image:` rather than `build:` is deliberate here. The service has zero fork
  # NOW BUILT FROM SOURCE. It used to pull erxes/erxes-next-automations, which
  # was defensible only while this service carried ZERO fork divergence. It no
  # longer does: checkValidTrigger in src/executions/calculateExecutions.ts now
  # treats a trigger with no segment as "enrol" instead of passing an empty
  # contentId to isInSegment, where Segments.getSegment('') throws and
  # sendTRPCMessage swallows the throw into a `false` — silently rejecting every
  # event, with no execution row written and 15s burned per event on the way to
  # that non-answer. Pulling would revert that fix with no deploy-time signal.
  #
  # The sibling Dockerfile still cannot build from a clean checkout (it COPYs a
  # gitignored dist/), which is exactly why Dockerfile.build was added — same
  # split core-api, gateway and the three plugin APIs already use.
  automations-service:
    build:
      context: ..
      dockerfile: backend/services/automations/Dockerfile.build
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      # NODE_ENV carries more weight than usual: isDev picks `localhost` in the
      # self-registered address above, so leaving it unset publishes
      # http://localhost:3302 and nothing can ever reach this service.
      NODE_ENV: production
      VERSION: os
      PORT: "3302"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      ALLOWED_DOMAINS: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      # Redis is this service's transport, not a cache. erxes-api-shared reads
      # these three names specifically — there is no REDIS_URL support.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Required even though this service serves no GraphQL of its own, because
      # it CALLS the plugins: sendCoreModuleProducer opens with
      #   if (pluginName && !(await isEnabled(pluginName))) return defaultValue;
      # and isEnabled() reads getPlugins(), which is built purely from this env
      # var. Without it every cross-plugin producer call silently returns its
      # defaultValue instead of reaching the plugin.
      #
      # That failure is invisible: AI knowledge indexing asks frontline for the
      # knowledge base articles, gets the `{documents: []}` default back, and
      # marks all 13 published articles "skipped — the source is unavailable or
      # not published" while the BullMQ job still reports success. Confirmed on
      # this instance: frontline logged nothing at all during a reindex.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # LOAD_BALANCER_ADDRESS is intentionally unset: it would override the
      # container-DNS address the service registers for itself.
      #
      # AI Agent action. getEnv reads process.env only — unlike the mail
      # settings there is no Configs-collection fallback, so an AI agent
      # configured in the UI still needs the key here (per-agent DB config wins
      # when set). Model defaults to gpt-5-mini when unset.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
      NODE_OPTIONS: --max-old-space-size=384
    # Liveness only. Nothing blocks on this service the way the gateway blocks
    # on the federated plugin APIs, so it needs none of their 180s start_period.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3302)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    # `erxes` only — never addressed from the internet.
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 512M

  # ── logs-service: audit trail, activity log and revert history ────────────
  # Same self-registration contract as automations: serviceName is the literal
  # 'logs-service' (services/logs/src/main.ts), so the compose key must match.
  # Also must NOT appear in ENABLED_PLUGINS — it serves no /graphql either.
  #
  # This is not optional in practice. The services ALREADY running enqueue onto
  # 'logs-put_log' (erxes-api-shared utils/logs, createEventHandlers,
  # revertCapture) and the only consumers live in this image, so those jobs
  # accumulate unbounded in a noeviction Redis. Without it the activity-log
  # panel stays permanently empty and the revert feature has no history to
  # invert. It is also a producer for automations.
  #
  # Published multi-arch, so unlike automations it is arch-safe either way.
  logs-service:
    image: erxes/erxes-next-logs:${ERXES_LOGS_VERSION:-3.0.64}
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NODE_ENV: production
      VERSION: os
      PORT: "3301"
      DOMAIN: https://${ERXES_UI_DOMAIN}
      ALLOWED_DOMAINS: https://${ERXES_UI_DOMAIN}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/erxes?authSource=admin&directConnection=true
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Same reason as automations-service: this service calls back INTO the
      # plugins. afterProcess/utils.ts sendProducer() dispatches to
      # context.pluginName, and sendCoreModuleProducer drops the call to its
      # defaultValue unless isEnabled(pluginName) is true — which is decided
      # solely by this env var. Without it every afterProcess hook is a no-op,
      # and because sendProducer swallows errors it fails silently.
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-frontline,sales,operation,calcom}
      # Lighter than automations: two Mongo-writing queue workers, no AI path.
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3301)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [erxes]
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mongo-data:
  redis-data:

networks:
  erxes:
  dokploy-network:
    external: true
